# Example PortBridge configuration.
#
# Installed default location: ~/.config/portbridge/config.toml
# (PortBridge creates this automatically on first run with built-in
# defaults; this file is a documented reference, not required reading.)
#
# No secrets belong in this file. The relay auth token lives separately
# at ~/.config/portbridge/relay_token (mode 600) -- set it with
# `portbridge configure --relay-token <token>`, never by hand-editing
# this file.

[network]
# Local address PortBridge forwards FROM. Keep this at 127.0.0.1 unless you
# specifically need to forward a service bound to a different local
# interface -- PortBridge will not bind other interfaces automatically.
bind_address = "127.0.0.1"

# Default local port used when you run `portbridge start` with no --port
# and answer the interactive prompt with Enter. 0 means "always ask".
local_port = 0

[relay]
# Your relay's control address/port -- where `frpc` connects to register
# the tunnel (frps's bindPort). See README's "Deploying your own relay".
server_addr = ""
server_port = 0

# The port frps listens on internally for this tunnel's data (must match
# allowPorts in your frps.toml and the bridge service in front of it, if
# your platform only allows one exposed port per service).
remote_port = 0

# What remote clients actually connect to -- may be the same host:port as
# server_addr/server_port, or a separate bridge service's address if your
# platform (like Railway's TCP Proxy) only allows one exposed port per
# service.
public_addr = ""
public_port = 0

[behavior]
# Informational only -- PortBridge never enables/starts systemd on its own.
# Set this to true as a personal reminder that you've set up the systemd
# unit for auto-start on boot; it has no other effect.
auto_start = false

# Whether the background monitor restarts frpc automatically if the
# process exits unexpectedly. frpc has its own internal reconnect logic
# for transient network drops -- this is for the process itself dying.
reconnect = true

# 0 = retry indefinitely. Any positive number = give up after that many
# consecutive failed attempts and mark forwarding FAILED.
reconnect_max_attempts = 0

# Exponential backoff: delay = min(reconnect_backoff_max_seconds,
# reconnect_backoff_base_seconds * 2^(attempt-1))
reconnect_backoff_base_seconds = 2
reconnect_backoff_max_seconds = 60

# How often the background monitor checks frpc + local-port health.
health_check_interval_seconds = 15

# Timeout used for `portbridge test`, `portbridge setup`'s relay
# reachability check, and internal connectivity checks.
connect_timeout_seconds = 5

[logging]
level = "INFO"          # DEBUG | INFO | WARNING | ERROR
max_bytes = 5242880      # Rotate the log file after ~5 MB
backup_count = 3         # Keep this many rotated log files
