[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portbridge"
version = "1.0.0"
description = "TCP port forwarding manager built on Tailscale Funnel"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PortBridge" }]
dependencies = [
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[project.scripts]
portbridge = "portbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
